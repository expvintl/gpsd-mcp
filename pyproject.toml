[project]
name = "gpsd-mcp"
version = "0.1.0"
description = "Streamable-HTTP MCP server that exposes the gpsd GPS daemon, built on FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
gpsd-mcp = "gpsd_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpsd_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
